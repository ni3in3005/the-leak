#:schema node_modules/wrangler/config-schema.json
name = "leak-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Local-only placeholder UUID works for `wrangler dev --local`.
# After `wrangler d1 create leak-db`, replace database_id with the real remote id
# (keep preview_database_id as-is for local SQLite).
[[d1_databases]]
binding = "DB"
database_name = "leak-db"
database_id = "b3564f2f-1b39-4124-9e95-7a8752dd0276"
migrations_dir = "../../migrations"

# Create with: wrangler r2 bucket create leak-backups
# Local `wrangler dev --local` still works before the remote bucket exists.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "leak-backups"

[vars]
# Public Clerk publishable key is fine in vars; secret goes in .dev.vars / secrets
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsudGhlLWxlYWsucGFnZXMuZGV2JA"
# Comma-separated allowed frontend origins for CORS
# No trailing slash — must match browser Origin exactly
CORS_ORIGIN = "http://localhost:5173,https://the-leak.pages.dev"

[dev]
port = 8787
local_protocol = "http"

# Secrets (set via `wrangler secret put` or apps/api/.dev.vars for local):
# CLERK_SECRET_KEY=sk_test_...
